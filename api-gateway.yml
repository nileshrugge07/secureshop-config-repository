server:
  port: 0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}:${random.value}

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: identity-service-route
              uri: lb://IDENTITY-SERVICE
              predicates:
                - Path=/identity/**
              filters:
                - StripPrefix=1

            - id: catalog-service-route
              uri: lb://CATALOG-SERVICE
              predicates:
                - Path=/catalog/**
              filters:
                - StripPrefix=1

            - id: order-service-route
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/orders/**
              filters:
                - StripPrefix=1

            - id: payment-service-route
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/payments/**
              filters:
                - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - gateway

  endpoint:
    health:
      show-details: always
